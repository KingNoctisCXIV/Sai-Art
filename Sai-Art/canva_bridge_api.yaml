openapi: 3.1.0
info:
  title: Canva Bridge API
  version: 1.0.0
  description: |
    This OpenAPI specification defines a simple bridge service that accepts
    structured requests from your custom GPT and forwards them to the Canva
    Connect API using your access token. Use this specification when
    registering a new Action in the GPT Builder. Replace the `servers` URL
    with the actual host where your bridge service will run.
servers:
  - url: https://sai-art.onrender.com
paths:
  /designs:
    post:
      operationId: createDesign
      summary: Create a design in Canva
      description: |
        Creates a new Canva design from a specified template. The body
        contains the template ID and optional page instructions for text
        and images. The service calls the Canva Connect API on your
        behalf using the stored access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: string
                  description: The Canva template ID to base the design on.
                title:
                  type: string
                  description: A name for the new design.
                pages:
                  type: array
                  description: List of page definitions containing text and optional image URLs.
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                        description: Text content to place on the page.
                      image_url:
                        type: string
                        description: URL of an image to insert on the page.
              required:
                - template_id
      responses:
        '200':
          description: Design created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  design_id:
                    type: string
                    description: The ID of the newly created design.
                  design_url:
                    type: string
                    description: A shareable link to the design.
  /designs/{design_id}/export:
    post:
      operationId: exportDesign
      summary: Export a Canva design
      description: |
        Exports a specified design to an image or PDF format. The
        bridge calls the Canva Connect API to export the design and
        returns a link to the exported file.
      parameters:
        - name: design_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the design to export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  description: Desired export format.
                  enum: [png, jpg, pdf]
              required:
                - format
      responses:
        '200':
          description: Export created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_url:
                    type: string
                    description: Link to the exported file ready to download.
